                    button.setAttribute('aria-checked', on ? 'true' : 'false');
                    button.querySelector('.motion-state').textContent = on ? 'ON' : 'OFF';

                button.addEventListener('click', function () {

        <script>
            // Phone navigation. Below 600px the four names give way to a burger, which opens the tree listing. Without JavaScript
            // the names stay in the navbar as links, and the burger and the listing stay hidden. The styles are in style.css
            (function () {
                var root = document.documentElement;
                var burger = document.getElementById('burger');
                var panel = document.getElementById('ls-panel');
                var phone = window.matchMedia('(max-width: 600px)');

                function setOpen(open) {
                    panel.hidden = !open;
                    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
                }

                // The burger toggles the panel. Focus stays on the burger, whether the panel opens or closes
                burger.addEventListener('click', function () {
                    setOpen(panel.hidden);
                    burger.focus({ preventScroll: true });
                });

                // Escape closes the panel and returns focus to the burger
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && !panel.hidden) {
                        setOpen(false);
                        burger.focus({ preventScroll: true });
                    }
                });

                // Following a link closes the panel, and the link still takes the reader to its section. That jump moves focus
                // off the burger, so focus goes back to the burger after the jump
                Array.prototype.forEach.call(panel.querySelectorAll('a'), function (link) {
                    link.addEventListener('click', function () {
                        setOpen(false);
                        setTimeout(function () { burger.focus({ preventScroll: true }); }, 0);
                    });
                });

                // Growing past phone width with the panel open closes it
                phone.addEventListener('change', function (e) {
                    if (!e.matches) setOpen(false);
                });

                // The script is running, so the burger replaces the names on phones
                burger.removeAttribute('hidden');
                root.classList.add('menu-ready');
            })();
        </script>

        <script>
            // The landing, the pages it opens, and the tree. The landing types whoami and tree, and its tree is the first page. A
            // click on a navbar name, a footnote or a file moves to another page in four steps: the screen fades out to an empty
            // terminal, the current prompt appears at once and the cd is typed, the new prompt appears at once, and tree or cat is
            // typed and its output follows. Back, Forward, a typed address and a direct load change the page at once. A click on a
            // folder in a tree opens or closes it in place, and the counts follow each row as it appears or closes. A file's page
            // prints the file's markdown below the terminal. The tab title and the prompt show the
            // current path, and the address after # is the same path. Animated mode types and fades in what appears. Minimal mode shows
            // each change at once. Without JavaScript the landing stays as it is, and the noscript tree shows. The times are in ms, and
            // the constants below set them. The styles are in style.css
            function startTerminal() {
                var root = document.documentElement;
                var terminal = document.getElementById('terminal');
                var treeView = document.getElementById('tree-view');
                var fileView = document.getElementById('file-view');
                var pageContent = document.getElementById('page-content');
                var navbar = document.querySelector('.navbar');

                // Times in ms. The fade (750 ms, cubic-bezier(0.08, 0.52, 0.52, 1)) and the navbar's drop (500 ms, ease-out) are in the CSS
                var FADE_MS = 750;         // the landing's terminal fades in
                var AFTER_FADE_MS = 400;   // after the fade, before whoami types
                var PAUSE_MS = 300;        // after a command is typed, before its output appears
                var PROMPT_PAUSE_MS = 300; // after the second prompt appears, before `tree` types
                var LINE_MS = 120;         // the output pace: each line or block starts this long after the one above
                var LINE_FADE_MS = 250;    // each line or block fades in over this long
                var NAV_GAP_MS = 400;      // after the tree has faded in, before the navbar drops
                var TYPE_MIN_MS = 90;      // a typed character follows the one before after a random interval in this range
                var TYPE_MAX_MS = 170;
                var SWAP_MS = 250;         // the screen fades out to an empty terminal over this long, when a click moves to another page
                var CLEAR_BOX_MS = 300;    // then the box resizes to the empty box over this long
                var ROW_BOX_MS = 250;      // the box grows or shrinks over this long as a row arrives or goes, as long as the row's fade

                var REPO = {
                    aralloc: 'https://github.com/stavros-mhs/aralloc',
                    ginny: 'https://github.com/stavros-mhs/Ginny'
                };
                // The tree. Each folder lists its rows as [name, target]. A target is a route, or the repository's URL for a source/ entry.
                // The root's route is empty, and a file's route is its path in the repository
                var ROWS = {
                    '': [['user/', 'user'], ['projects/', 'projects'], ['skills/', 'skills'], ['contact/', 'contact']],
                    'user': [['HOBBIES.md', 'user/HOBBIES.md'], ['WHOAMI.md', 'user/WHOAMI.md']],
                    'projects': [['aralloc/', 'projects/aralloc'], ['ginny/', 'projects/ginny']],
                    'projects/aralloc': [['BRIEF.md', 'projects/aralloc/BRIEF.md'], ['source/', REPO.aralloc]],
                    'projects/ginny': [['BRIEF.md', 'projects/ginny/BRIEF.md'], ['source/', REPO.ginny]],
                    'skills': [['SKILLS.md', 'skills/SKILLS.md']],
                    'contact': [['INFO.md', 'contact/INFO.md']]
                };
                var FILES = {
                    'user/HOBBIES.md': true,
                    'user/WHOAMI.md': true,
                    'projects/aralloc/BRIEF.md': true,
                    'projects/ginny/BRIEF.md': true,
                    'skills/SKILLS.md': true,
                    'contact/INFO.md': true
                };

                function has(map, key) { return Object.prototype.hasOwnProperty.call(map, key); }
                function isFolder(key) { return has(ROWS, key); }
                function isFile(key) { return has(FILES, key); }
                function kindOf(target) { return /^https:\/\//.test(target) ? 'repo' : isFolder(target) ? 'dir' : 'file'; }
                function folderOf(key) { return isFile(key) ? key.slice(0, key.lastIndexOf('/')) : key; }
                function parentOf(folder) { var i = folder.lastIndexOf('/'); return i === -1 ? '' : folder.slice(0, i); }
                function nameOf(key) { return key.slice(key.lastIndexOf('/') + 1); }
                function hashFor(key) { return key === '' ? '#/' : isFile(key) ? '#/' + key : '#/' + key + '/'; }
                function promptText(folder) { return folder === '' ? '~$' : '~/' + folder + '$'; }
                function pathText(folder, file) { return file ? '/' + file : (folder ? '/' + folder : '/'); }
                // The route in an address after #. The key is null for a path that is not a route, and raw is the path as typed
                function parseHash(hash) {
                    var raw = hash.replace(/^#\/?/, '');
                    try { raw = decodeURIComponent(raw); } catch (e) {}
                    var key = raw.replace(/\/$/, '');
                    return { key: (isFolder(key) || isFile(key)) ? key : null, raw: raw };
                }
                // The id that a hash change or a click is compared with. A path that is not a route gets its own id
                function routeId(key, raw) { return key !== null ? key : '?' + raw; }
                function setHash(key) { if (location.hash !== hashFor(key)) location.hash = hashFor(key); }
                function countText(dirs, files) {
                    var s = dirs + (dirs === 1 ? ' directory' : ' directories');
                    if (files) s += ', ' + files + (files === 1 ? ' file' : ' files');
                    return s;
                }

                // Nodes are built with the DOM and textContent, never from HTML strings
                function el(tag, cls, text) {
                    var node = document.createElement(tag);
                    if (cls) node.className = cls;
                    if (text !== undefined) node.textContent = text;
                    return node;
                }
                function lineEl(text, cls) { return el('p', cls ? 'term-line ' + cls : 'term-line', text); }
                // A link to a route. A click on it runs the route
                function routeLink(key, label) {
                    var a = el('a', null, label);
                    a.setAttribute('href', hashFor(key));
                    a.setAttribute('data-route', key);
                    return a;
                }
                // A prompt with the path of its folder. The command that is typed after it goes after the space
                function promptLine(folder, cls) {
                    var p = lineEl('', cls);
                    p.appendChild(el('span', 'term-prompt', promptText(folder)));
                    p.appendChild(document.createTextNode(' '));
                    return p;
                }
                // A line that will fade in: it starts hidden, and its reveal sets it visible
                function hidden(node, animated) {
                    if (animated) {
                        node.classList.add('term-fade');
                        node.style.opacity = '0';
                    }
                    return node;
                }
                function isAnimated() { return root.getAttribute('data-motion') === 'animated'; }
                function keepInView(node) { node.scrollIntoView({ block: 'nearest' }); }

                // The cursor: a block the height of the text, in the body text colour. The script moves it with transform
                var cursor = null;
                function ensureCursor() {
                    if (!cursor) {
                        cursor = el('span', 'term-cursor');
                        cursor.setAttribute('aria-hidden', 'true');
                    }
                    if (!cursor.parentNode) terminal.appendChild(cursor);
                }
                function removeCursor() {
                    if (cursor && cursor.parentNode) cursor.parentNode.removeChild(cursor);
                }
                function placeCursor(x, y, w, h) {
                    ensureCursor();
                    var box = terminal.getBoundingClientRect();
                    cursor.style.width = w + 'px';
                    cursor.style.height = h + 'px';
                    cursor.style.transform = 'translate(' + (x - box.left) + 'px, ' + (y - box.top) + 'px)';
                }
                // After a character: at its right edge
                function cursorAfterChar(span) {
                    var r = span.getBoundingClientRect();
                    placeCursor(r.right, r.top, r.width, r.height);
                }
                // At the end of a line: after its last text, or at the start of a blank line
                function cursorAtLineEnd(line) {
                    var size = parseFloat(getComputedStyle(line).fontSize);
                    var range = document.createRange();
                    range.selectNodeContents(line);
                    var rects = Array.prototype.filter.call(range.getClientRects(), function (r) { return r.width > 0; });
                    var last = rects[rects.length - 1];
                    if (last) {
                        placeCursor(last.right, last.top, size * 0.625, last.height);
                    } else {
                        var box = line.getBoundingClientRect();
                        placeCursor(box.left, box.top, size * 0.625, box.height);
                    }
                }

                // Scheduled actions. Each action is { at, fn }, and fn(instant) changes the page: in animated mode it runs at its time
                // with instant false, and in minimal mode it runs at once with instant true. A batch's onDone runs when its last action
                // has run. flushAll runs whatever is still pending at once, which is how a click or a mode change ends an animation
                var pending = [];
                function runActions(actions, onDone, instant) {
                    if (instant || !isAnimated()) {
                        actions.forEach(function (a) { a.fn(true); });
                        if (onDone) onDone();
                        return;
                    }
                    if (!actions.length) {
                        if (onDone) onDone();
                        return;
                    }
                    root.classList.add('term-live');
                    var batch = { left: actions.length, onDone: onDone };
                    actions.forEach(function (a) {
                        var entry = { fn: a.fn, batch: batch, done: false, timer: null, off: null };
                        var run = function () {
                            if (entry.done) return;
                            entry.done = true;
                            if (entry.off) entry.off();
                            clearTimeout(entry.timer);
                            pending = pending.filter(function (e) { return e !== entry; });
                            entry.fn(false);
                            finishEntry(entry);
                        };
                        entry.timer = setTimeout(run, a.at);
                        // An action that waits for an element's fade (untilFade is the element) runs when that fade ends. Its time is then only a fallback
                        if (a.untilFade) {
                            var fading = a.untilFade;
                            var onFaded = function (e) { if (e.target === fading && e.propertyName === 'opacity') run(); };
                            fading.addEventListener('transitionend', onFaded);
                            entry.off = function () { fading.removeEventListener('transitionend', onFaded); };
                        }
                        pending.push(entry);
                    });
                }
                function finishEntry(entry) {
                    var b = entry.batch;
                    b.left--;
                    if (b.left === 0 && b.onDone) b.onDone();
                }
                function flushAll() {
                    var list = pending;
                    pending = [];
                    list.forEach(function (entry) {
                        if (entry.done) return;
                        entry.done = true;
                        if (entry.off) entry.off();
                        clearTimeout(entry.timer);
                        entry.fn(true);
                        finishEntry(entry);
                    });
                    if (list.length) boxRelease();
                }

                // Typing: one action per character, after a random interval. The first character is at `start`
                function typeFn(line, ch, cls) {
                    return function (instant) {
                        var span = el('span', cls || 'term-char', ch);
                        line.appendChild(span);
                        if (!instant) {
                            ensureCursor();
                            cursorAfterChar(span);
                            keepInView(line);
                        }
                    };
                }
                // One typing interval: a typed character follows the one before it after this long
                function typingGap() { return TYPE_MIN_MS + Math.random() * (TYPE_MAX_MS - TYPE_MIN_MS); }
                function typeActions(line, text, start) {
                    var actions = [];
                    var at = start;
                    Array.from(text).forEach(function (ch, i) {
                        if (i > 0) at += TYPE_MIN_MS + Math.random() * (TYPE_MAX_MS - TYPE_MIN_MS);
                        actions.push({ at: at, fn: typeFn(line, ch) });
                    });
                    return { actions: actions, end: at };
                }
                // The terminal's box follows its content. When the content changes by an animated step (the clear, a row arriving, a folder
                // closing), the box moves from the height on screen now to the height its content then needs, over ms, ease-out (the height
                // is the one thing that transitions, in animated mode only). It clips while it moves, so no text is ever outside it. When it
                // has arrived, or when something ends the sequence at once, the box goes back to its natural height, with no height set.
                // mutate changes the content. Not animated: the change is made at once
                function boxRelease() {
                    terminal.classList.remove('term-box-anim');
                    terminal.style.height = '';
                    terminal.style.transitionDuration = '';
                }
                function boxChange(mutate, animated, ms) {
                    if (!animated) {
                        mutate();
                        boxRelease();
                        return;
                    }
                    // The height on screen now, which may be part-way through an earlier move. It is set as it is, with no transition (the class
                    // is off), so the earlier move stops where it is and the new one starts from there
                    var cur = terminal.getBoundingClientRect().height;
                    terminal.classList.remove('term-box-anim');
                    terminal.style.height = cur + 'px';
                    mutate();
                    terminal.style.height = 'auto';
                    var target = terminal.getBoundingClientRect().height;
                    terminal.style.height = cur + 'px';
                    void terminal.offsetHeight;
                    if (Math.abs(target - cur) < 0.5) {
                        boxRelease();
                        return;
                    }
                    terminal.style.transitionDuration = ms + 'ms';
                    terminal.classList.add('term-box-anim');
                    terminal.style.height = target + 'px';
                }
                terminal.addEventListener('transitionend', function (e) {
                    if (e.target === terminal && e.propertyName === 'height') boxRelease();
                });
                // A line that comes into the box (the prompt after a tree, the message of an error): at once for a prompt, or with its fade
                // and the box's growth for output. Its fade is the existing 250 ms fade
                function arriveFn(parent, node, cursor) {
                    return function (instant) {
                        if (instant) {
                            parent.appendChild(node);
                            node.classList.remove('term-fade');
                            node.style.opacity = '1';
                            boxRelease();
                            return;
                        }
                        boxChange(function () { parent.appendChild(node); hidden(node, true); }, true, ROW_BOX_MS);
                        node.style.opacity = '1';
                        keepInView(node);
                        if (cursor) {
                            ensureCursor();

                                return res.text();
                            })
                            .then(function (text) { content[key] = { ok: true, text: text }; },
                                  function () { content[key] = { ok: false }; });
                    }
                    return loading[key];
                }

                // The last route asked for. A hash change to it is not run again, since the click that asked for it has run it
                var lastRoute = null;
                // The address the page opened on. It runs once the landing has played, unless the reader has picked a route first
                var initial = parseHash(location.hash);
                var pendingInitial = true;
                function settleInitial() {
                    if (!pendingInitial) return;
                    pendingInitial = false;
                    lastRoute = routeId(initial.key, initial.raw);
                    applyRoute(initial.key, initial.raw, false);
                }
                // A user's action ends whatever is still animating, and takes the place of an address that is still waiting
                function userAction() {
                    pendingInitial = false;
                    flushAll();
                }
                // Shows a route: a file's page, or a folder's tree on a page of its own. The home route is the landing's tree. click is true
                // for a click: in animated mode it plays the sequence (clear, cd, tree or cat). Without a click (Back, Forward, a typed
                // address, the page a direct load opens) the old content is replaced at once, and the destination's prompt appears with its
                // command typed after it, with no cd. Minimal mode shows the page at once
                function applyRoute(key, raw, click) {
                    var animated = isAnimated();
                    if (key === null) {
                        buildErrorPage(raw, animated);
                        return;
                    }
                    if (isFile(key)) {
                        if (!content[key]) {
                            loadFile(key).then(function () { if (lastRoute === key) applyRoute(key, key, click); });
                            return;
                        }
                        if (pageKind === 'file' && pageFile === key) {
                            setPath(folderOf(key), key);
                            return;
                        }
                        buildFilePage(key, animated, click);
                        return;
                    }
                    if ((pageKind === 'home' || pageKind === 'dir') && pageFolder === key) {
                        setPath(key);
                        return;
                    }
                    if (animated && click) clearThen(function (instant) { buildTreePage(key, !instant, false, null, false); });
                    else buildTreePage(key, animated, false, null, animated);
                }
                // A click or the navbar: sets the address to the route, and shows it
                function navigate(key) {
                    userAction();
                    lastRoute = key;
                    setHash(key);
                    applyRoute(key, key, true);
                }
                // A click on a folder opens it in place, or closes it if it is open. Opening a folder only lists it: the terminal does
                // not move, so the path, the prompt and the address stay where they are
                function toggleDir(key, link) {
                    userAction();
                    // A click during a file's fade-out finds the tree already gone once the swap has run
                    if (!output) return;
                    var active = document.activeElement;
                    expanded[key] = !expanded[key];
                    var animated = isAnimated();
                    var rows = syncOutput(animated, 0, animated ? 'prompt' : false, animated);
                    runActions(rows.actions, null);
                    if (animated) {
                        ensureCursor();
                        cursorAtLineEnd(treePrompt);
                    }
                    if (active && !active.isConnected && link.isConnected) link.focus({ preventScroll: true });
                }

                // Links that name a route get it as data. The tree's own links are made with it
                Array.prototype.forEach.call(document.querySelectorAll('a[href^="#/"]'), function (a) {
                    var p = parseHash(a.getAttribute('href'));
                    if (p.key !== null) a.setAttribute('data-route', p.key);
                });
                Object.keys(FILES).forEach(function (key) { loadFile(key); });

                // A click on a route runs it. The browser's change of address is then not run again
                document.addEventListener('click', function (e) {
                    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
                    var link = e.target.closest ? e.target.closest('a[data-route]') : null;
                    if (!link) return;
                    e.preventDefault();
                    var key = link.getAttribute('data-route');
                    if (link.hasAttribute('data-toggle')) toggleDir(key, link);
                    else navigate(key);
                });
                // A key ends a running sequence at once, as a click does. The landing is left to play
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;
                    if (!pendingInitial && pending.length) flushAll();
                });
                // Back, forward and a typed address show their route
                window.addEventListener('hashchange', function () {
                    var p = parseHash(location.hash);
                    var id = routeId(p.key, p.raw);
                    if (id === lastRoute) return;
                    userAction();
                    lastRoute = id;
                    applyRoute(p.key, p.raw, false);
                });
                // Leaving animated mode shows everything at once and stops the animations. Going back to animated mode shows the
                // terminal again, so the page does not stay hidden
                new MutationObserver(function () {
                    if (isAnimated()) {
                        root.classList.add('term-live');
                        return;
                    }
                    flushAll();
                    removeCursor();
                    root.classList.remove('term-live');
                    settleInitial();
                }).observe(root, { attributes: true, attributeFilter: ['data-motion'] });

                // The landing. In animated mode it plays on the first page, and the address that opened the page runs after it
                setPath('');
                if (isAnimated()) root.classList.add('term-live');
                lastRoute = routeId(initial.key, initial.raw);
                buildTreePage('', isAnimated(), true, settleInitial);
            }

            // If the terminal fails, the page shows everything: the hidden states apply only while term-failed is absent
            try {
                startTerminal();
            } catch (e) {
                document.querySelectorAll('#terminal .term-char, #terminal .term-line, #page-content .term-block').forEach(function (el) { el.style.opacity = '1'; });
                document.documentElement.classList.add('term-failed');
            }
        </script>
    </body>
    </html>
