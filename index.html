        <script>
            (function () {
                var saved = null;
                try { saved = localStorage.getItem('theme'); } catch (e) {}
                var theme = (saved === 'dark' || saved === 'light')
                    ? saved
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                document.documentElement.setAttribute('data-theme', theme);
            })();
        </script>
        <script>
            (function () {
                var saved = null;
                try { saved = localStorage.getItem('motion'); } catch (e) {}
                var mode = (saved === 'animated' || saved === 'minimal')
                    ? saved
                    : ((window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'minimal' : 'animated');
                document.documentElement.setAttribute('data-motion', mode);
            })();
        </script>

        <footer>

        <script>
            // Sync the toggle with the theme the head script already set, then save changes
            const toggle = document.getElementById('toggle');
            const root = document.documentElement;

            toggle.checked = root.getAttribute('data-theme') === 'dark';

            toggle.addEventListener('change', function () {
                const theme = this.checked ? 'dark' : 'light';
                root.setAttribute('data-theme', theme);
                try { localStorage.setItem('theme', theme); } catch (e) {}
            });
        </script>

        <script>
            // Show the Animations switch, which needs JavaScript, and keep it in step with the mode
            (function () {
                var root = document.documentElement;
                var button = document.getElementById('motion');

                function sync() {
                    var on = root.getAttribute('data-motion') === 'animated';
                    button.setAttribute('aria-checked', on ? 'true' : 'false');
                    button.querySelector('.motion-state').textContent = on ? 'On' : 'Off';
                }

                button.removeAttribute('hidden');
                sync();

                button.addEventListener('click', function () {
                    var next = root.getAttribute('data-motion') === 'animated' ? 'minimal' : 'animated';
                    root.setAttribute('data-motion', next);
                    sync();
                    try { localStorage.setItem('motion', next); } catch (e) {}
                });
            })();
        </script>
        <script>
            // Phone navigation. Below 600px the four names give way to a burger, which opens the tree listing. Without JavaScript
            // the names stay in the navbar as links, and the burger and the listing stay hidden. The styles are in style.css
            (function () {
                var root = document.documentElement;
                var burger = document.getElementById('burger');
                var panel = document.getElementById('ls-panel');
                var phone = window.matchMedia('(max-width: 600px)');

                function setOpen(open) {
                    panel.hidden = !open;
                    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
                }

                // The burger toggles the panel. Focus stays on the burger, whether the panel opens or closes
                burger.addEventListener('click', function () {
                    setOpen(panel.hidden);
                    burger.focus({ preventScroll: true });
                });

                // Escape closes the panel and returns focus to the burger
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && !panel.hidden) {
                        setOpen(false);
                        burger.focus({ preventScroll: true });
                    }
                });

                // Following a link closes the panel, and the link still takes the reader to its section. That jump moves focus
                // off the burger, so focus goes back to the burger after the jump
                Array.prototype.forEach.call(panel.querySelectorAll('a'), function (link) {
                    link.addEventListener('click', function () {
                        setOpen(false);
                        setTimeout(function () { burger.focus({ preventScroll: true }); }, 0);
                    });
                });

                // Growing past phone width with the panel open closes it
                phone.addEventListener('change', function (e) {
                    if (!e.matches) setOpen(false);
                });

                // The script is running, so the burger replaces the names on phones
                burger.removeAttribute('hidden');
                root.classList.add('menu-ready');
            })();
        </script>

        <script>
            // Landing terminal. Animated mode only. It types whoami and ls -l at human speed. The printed lines fade in at the
            // output pace, and a new prompt follows the output. A blinking cursor marks the end of the text being typed or printed.
            // Then the navbar drops in. The times are in ms from the start, and the constants below set them. Without JavaScript,
            // and in minimal mode, the text shows as it stands. The styles are in style.css
            function runTerminal() {
                var root = document.documentElement;
                if (root.getAttribute('data-motion') !== 'animated') return;

                // Times in ms. The fade (750 ms, cubic-bezier(0.08, 0.52, 0.52, 1)) and the navbar's drop (500 ms, ease-out) are in the CSS
                var FADE_MS = 750;        // the terminal fades in
                var AFTER_FADE_MS = 400;  // after the fade, before the first command
                var PAUSE_MS = 300;       // after a command, before the output it produces
                var GAP_MS = 400;         // after a printed line has faded in, before the next command
                var LINE_MS = 120;        // the output pace: each line starts this long after the line above
                var LINE_FADE_MS = 250;   // each printed line fades in over this long
                var NAV_GAP_MS = 400;     // after the last output line has faded in, before the navbar drops
                var TYPE_MIN_MS = 90;     // a typed character follows the one before after a random interval in this range
                var TYPE_MAX_MS = 170;

                var terminal = document.getElementById('terminal');
                var navbar = document.querySelector('.navbar');
                var cmd1 = document.getElementById('term-cmd-1');
                var cmd2 = document.getElementById('term-cmd-2');
                var printed = document.getElementById('term-print-1');
                var outLines = Array.prototype.slice.call(document.querySelectorAll('#term-output .term-line'));
                var promptEnd = document.getElementById('term-prompt-end');
                var lines = [printed].concat(outLines, [promptEnd]);

                // Wraps each character of a node's text in its own span, which starts hidden. The structure stays, so the prompt
                // keeps its colour. The spans are added to the list in page order
                function splitChars(node, spans) {
                    Array.prototype.slice.call(node.childNodes).forEach(function (child) {
                        if (child.nodeType === 3) {
                            var fragment = document.createDocumentFragment();
                            Array.prototype.forEach.call(child.textContent, function (ch) {
                                var span = document.createElement('span');
                                span.className = 'term-char';
                                span.textContent = ch;
                                span.style.opacity = '0';
                                fragment.appendChild(span);
                                spans.push(span);
                            });
                            node.replaceChild(fragment, child);
                        } else if (child.nodeType === 1) {
                            splitChars(child, spans);
                        }
                    });
                    return spans;
                }

                // The schedule. Each event shows one character or one printed line at its time. A typed character follows the one
                // before after a random interval. The first character of a command shows at the command's start
                var events = [];
                function typeAt(spans, start) {
                    var at = start;
                    spans.forEach(function (span, i) {
                        if (i > 0) at += TYPE_MIN_MS + Math.random() * (TYPE_MAX_MS - TYPE_MIN_MS);
                        events.push({ span: span, at: at });
                    });
                    return at;
                }
                // Returns the time the line has faded in
                function printAt(line, at) {
                    events.push({ line: line, at: at });
                    return at + LINE_FADE_MS;
                }

                var typed1End = typeAt(splitChars(cmd1, []), FADE_MS + AFTER_FADE_MS);
                var printedIn = printAt(printed, typed1End + PAUSE_MS);
                var typed2End = typeAt(splitChars(cmd2, []), printedIn + GAP_MS);
                var treeStart = typed2End + PAUSE_MS;
                var lastLineIn = treeStart;
                outLines.forEach(function (line, i) {
                    lastLineIn = printAt(line, treeStart + i * LINE_MS);
                });
                printAt(promptEnd, lastLineIn);      // the new prompt follows the output, once the output has faded in
                var navStart = lastLineIn + NAV_GAP_MS;

                // The cursor: a block the height of the text, in the body text colour. It sits at the end of the text being typed or
                // printed. The script moves it with transform, so its blink is not restarted
                var cursor = document.createElement('span');
                cursor.className = 'term-cursor';
                cursor.setAttribute('aria-hidden', 'true');
                terminal.appendChild(cursor);

                function placeCursor(x, y, w, h) {
                    var box = terminal.getBoundingClientRect();
                    cursor.style.width = w + 'px';
                    cursor.style.height = h + 'px';
                    cursor.style.transform = 'translate(' + (x - box.left) + 'px, ' + (y - box.top) + 'px)';
                }
                // After a character: at its right edge
                function cursorAfterChar(span) {
                    var r = span.getBoundingClientRect();
                    placeCursor(r.right, r.top, r.width, r.height);
                }
                // At the end of a line: after its last text, or at the start of a blank line
                function cursorAtLineEnd(line) {
                    var size = parseFloat(getComputedStyle(line).fontSize);
                    var range = document.createRange();
                    range.selectNodeContents(line);
                    var rects = Array.prototype.filter.call(range.getClientRects(), function (r) { return r.width > 0; });
                    var last = rects[rects.length - 1];
                    if (last) {
                        placeCursor(last.right, last.top, size * 0.625, last.height);
                    } else {
                        var box = line.getBoundingClientRect();
                        placeCursor(box.left, box.top, size * 0.625, box.height);
                    }
                }

                // Everything starts hidden. The cursor starts before the first character
                events.forEach(function (event) {
                    if (event.span) event.span.style.opacity = '0';
                });
                lines.forEach(function (line) { line.style.opacity = '0'; });
                var first = events[0].span.getBoundingClientRect();
                placeCursor(first.left, first.top, first.width, first.height);
                navbar.style.setProperty('--drop-delay', navStart + 'ms');
                root.classList.add('term-live');

                // Each event shows at its time, and the cursor moves to it
                var timers = [];
                var t0 = performance.now();
                events.forEach(function (event) {
                    timers.push(setTimeout(function () {
                        if (event.span) {
                            event.span.style.opacity = '1';
                            cursorAfterChar(event.span);
                        } else {
                            event.line.style.opacity = '1';
                            cursorAtLineEnd(event.line);
                        }
                    }, Math.max(0, event.at - (performance.now() - t0))));
                });

                // Leaving animated mode shows everything at once and stops the timeline. Switching back later does not replay it
                new MutationObserver(function () {
                    if (root.getAttribute('data-motion') === 'animated') return;
                    timers.forEach(clearTimeout);
                    events.forEach(function (event) { (event.span || event.line).style.opacity = '1'; });
                    cursor.remove();
                    root.classList.remove('term-live');
                }).observe(root, { attributes: true, attributeFilter: ['data-motion'] });
            }

            // If the terminal fails, the page shows everything: the hidden states apply only while term-failed is absent
            try {
                runTerminal();
            } catch (e) {
                document.querySelectorAll('#terminal .term-char, #terminal .term-fade').forEach(function (el) { el.style.opacity = '1'; });
                document.documentElement.classList.add('term-failed');
            }
        </script>
