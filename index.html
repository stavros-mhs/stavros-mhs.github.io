                    button.setAttribute('aria-checked', on ? 'true' : 'false');
                    button.querySelector('.motion-state').textContent = on ? 'On' : 'Off';

        <script>
            // Phone navigation. Below 600px the four names give way to a burger, which opens the tree listing. Without JavaScript
            // the names stay in the navbar as links, and the burger and the listing stay hidden. The styles are in style.css
            (function () {
                var root = document.documentElement;
                var burger = document.getElementById('burger');
                var panel = document.getElementById('ls-panel');
                var phone = window.matchMedia('(max-width: 600px)');

                function setOpen(open) {
                    panel.hidden = !open;
                    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
                }

                // The burger toggles the panel. Focus stays on the burger, whether the panel opens or closes
                burger.addEventListener('click', function () {
                    setOpen(panel.hidden);
                    burger.focus({ preventScroll: true });
                });

                // Escape closes the panel and returns focus to the burger
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && !panel.hidden) {
                        setOpen(false);
                        burger.focus({ preventScroll: true });
                    }
                });

                // Following a link closes the panel, and the link still takes the reader to its section. That jump moves focus
                // off the burger, so focus goes back to the burger after the jump
                Array.prototype.forEach.call(panel.querySelectorAll('a'), function (link) {
                    link.addEventListener('click', function () {
                        setOpen(false);
                        setTimeout(function () { burger.focus({ preventScroll: true }); }, 0);
                    });
                });

                // Growing past phone width with the panel open closes it
                phone.addEventListener('change', function (e) {
                    if (!e.matches) setOpen(false);
                });

                // The script is running, so the burger replaces the names on phones
                burger.removeAttribute('hidden');
                root.classList.add('menu-ready');
            })();

        <script>
            // The landing terminal and the tree. The tree is the terminal's first output. A click on a directory opens or closes it
            // in place, and its rows appear under it. A click on a file replaces the tree with the file's subpage, and the subpage's
            // cd .. line returns to the tree. The title and the prompt show the current path, and the address after # is the same path.
            // Animated mode types whoami and tree at human speed, and fades in what appears. Minimal mode shows each change at once.
            // Without JavaScript the landing stays as it is, and the noscript tree shows. The times are in ms, and the constants below
            // set them. The styles are in style.css
            function startTerminal() {
                var root = document.documentElement;
                var terminal = document.getElementById('terminal');
                var treeView = document.getElementById('tree-view');
                var fileView = document.getElementById('file-view');
                var output = document.getElementById('term-output');
                var promptEnd = document.getElementById('term-prompt-end');
                var navbar = document.querySelector('.navbar');

                // Times in ms. The fade (750 ms, cubic-bezier(0.08, 0.52, 0.52, 1)) and the navbar's drop (500 ms, ease-out) are in the CSS
                var FADE_MS = 750;         // the landing's terminal fades in
                var AFTER_FADE_MS = 400;   // after the fade, before the first command
                var PAUSE_MS = 300;        // after a command is typed, before its output appears
                var PROMPT_PAUSE_MS = 300; // after the second prompt appears, before `tree` starts to type
                var LINE_MS = 120;         // the output pace: each line or block starts this long after the one above
                var LINE_FADE_MS = 250;    // each line or block fades in over this long
                var NAV_GAP_MS = 400;      // after the tree has faded in, before the navbar drops
                var TYPE_MIN_MS = 90;      // a typed character follows the one before after a random interval in this range
                var TYPE_MAX_MS = 170;

                var REPO = {
                    aralloc: 'https://github.com/stavros-mhs/aralloc',
                    ginny: 'https://github.com/stavros-mhs/Ginny'
                };
                // The tree. Each folder lists its rows as [name, target]. A target is a route, or the repository's URL for a source/ entry.
                // The root's route is empty, and a file's route is its path in the repository
                var ROWS = {
                    '': [['user/', 'user'], ['projects/', 'projects'], ['skills/', 'skills'], ['contact/', 'contact']],
                    'user': [['HOBBIES.md', 'user/HOBBIES.md'], ['WHOAMI.md', 'user/WHOAMI.md']],
                    'projects': [['aralloc/', 'projects/aralloc'], ['ginny/', 'projects/ginny']],
                    'projects/aralloc': [['BRIEF.md', 'projects/aralloc/BRIEF.md'], ['source/', REPO.aralloc]],
                    'projects/ginny': [['BRIEF.md', 'projects/ginny/BRIEF.md'], ['source/', REPO.ginny]],
                    'skills': [['SKILLS.md', 'skills/SKILLS.md']],
                    'contact': [['INFO.md', 'contact/INFO.md']]
                };
                var FILES = {
                    'user/HOBBIES.md': true,
                    'user/WHOAMI.md': true,
                    'projects/aralloc/BRIEF.md': true,
                    'projects/ginny/BRIEF.md': true,
                    'skills/SKILLS.md': true,
                    'contact/INFO.md': true
                };

                function has(map, key) { return Object.prototype.hasOwnProperty.call(map, key); }
                function isFolder(key) { return has(ROWS, key); }
                function isFile(key) { return has(FILES, key); }
                function kindOf(target) { return /^https:\/\//.test(target) ? 'repo' : isFolder(target) ? 'dir' : 'file'; }
                function folderOf(key) { return isFile(key) ? key.slice(0, key.lastIndexOf('/')) : key; }
                function parentOf(folder) { var i = folder.lastIndexOf('/'); return i === -1 ? '' : folder.slice(0, i); }
                function nameOf(key) { return key.slice(key.lastIndexOf('/') + 1); }
                function hashFor(key) { return key === '' ? '#/' : isFile(key) ? '#/' + key : '#/' + key + '/'; }
                function promptText(folder) { return folder === '' ? '~$' : '~/' + folder + '$'; }
                // The route in an address after #. The key is null for a path that is not a route, and raw is the path as typed
                function parseHash(hash) {
                    var raw = hash.replace(/^#\/?/, '');
                    try { raw = decodeURIComponent(raw); } catch (e) {}
                    var key = raw.replace(/\/$/, '');
                    return { key: (isFolder(key) || isFile(key)) ? key : null, raw: raw };
                }
                // The route that a hash change or a click is compared with. A path that is not a route gets its own id
                function routeId(key, raw) { return key !== null ? key : '?' + raw; }

                // Nodes are built with the DOM and textContent, never from HTML strings
                function el(tag, cls, text) {
                    var node = document.createElement(tag);
                    if (cls) node.className = cls;
                    if (text !== undefined) node.textContent = text;
                    return node;
                }
                function lineEl(text, cls) { return el('p', cls ? 'term-line ' + cls : 'term-line', text); }
                // A link to a route. A click on it runs the route; a folder's link (data-toggle) also opens or closes it
                function routeLink(key, label) {
                    var a = el('a', null, label);
                    a.setAttribute('href', hashFor(key));
                    a.setAttribute('data-route', key);
                    return a;
                }
                function upLine(folder) {
                    var p = lineEl('');
                    p.appendChild(routeLink(folder, 'cd ..'));
                    return p;
                }
                function promptLine(folder) {
                    var p = lineEl('', 'term-cmd');
                    p.appendChild(el('span', 'term-prompt', promptText(folder)));
                    p.appendChild(document.createTextNode(' '));
                    return p;
                }

                // The tree. Folders that are open have their rows under them, and the rows keep their branch glyphs. A row's node is
                // kept while the row shows, so a row that closes and opens again is the same element
                var expanded = {};                         // a folder's route -> true while it is open
                var rowNodes = {};                         // a row's target -> its element
                var headerNode = lineEl('~/');
                var blankNode = lineEl('', 'term-blank');
                var countNode = lineEl('');

                // The rows that show, in order, with the branch glyphs they print with
                function visibleRows() {
                    var items = [];
                    (function walk(folder, indent) {
                        var rows = ROWS[folder];
                        rows.forEach(function (row, i) {
                            var last = i === rows.length - 1;
                            var kind = kindOf(row[1]);
                            items.push({ key: row[1], name: row[0], prefix: indent + (last ? '└── ' : '├── '), kind: kind });
                            if (kind === 'dir' && expanded[row[1]]) walk(row[1], indent + (last ? '    ' : '│   '));
                        });
                    })('', '');
                    return items;
                }
                function rowNode(item) {
                    if (!rowNodes[item.key]) {
                        var p = lineEl(item.prefix);
                        var a;
                        if (item.kind === 'repo') {
                            a = el('a', 'term-repo', item.name);
                            a.setAttribute('href', item.key);
                            a.setAttribute('target', '_blank');
                            a.setAttribute('rel', 'noopener');
                        } else {
                            a = routeLink(item.key, item.name);
                            if (item.kind === 'dir') a.setAttribute('data-toggle', '');
                        }
                        p.appendChild(a);
                        rowNodes[item.key] = p;
                    }
                    return rowNodes[item.key];
                }
                // The count line counts what shows. Directories are counted as the tree counts them, and a source/ entry is a directory
                function countText(dirs, files) {
                    var s = dirs + (dirs === 1 ? ' directory' : ' directories');
                    if (files) s += ', ' + files + (files === 1 ? ' file' : ' files');
                    return s;
                }
                // Shows the tree as it stands. Rows that are new fade in one by one when animate is set, and the page keeps the newest
                // of them in view. The cursor, if it is on the tree, moves with the prompt
                function renderTree(animate) {
                    var items = visibleRows();
                    var nodes = [headerNode].concat(items.map(rowNode), [blankNode, countNode]);
                    var dirs = 0;
                    var files = 0;
                    items.forEach(function (item) { if (item.kind === 'file') files++; else dirs++; });
                    countNode.textContent = countText(dirs, files);
                    Array.prototype.slice.call(output.children).forEach(function (child) {
                        if (nodes.indexOf(child) === -1) output.removeChild(child);
                    });
                    // Only the rows that are out of place move, so a focused link keeps its focus
                    var fresh = [];
                    var ref = output.firstChild;
                    nodes.forEach(function (node) {
                        if (node === ref) {
                            ref = ref.nextSibling;
                            return;
                        }
                        if (node.parentNode !== output) fresh.push(node);
                        output.insertBefore(node, ref);
                    });
                    var rows = fresh.filter(function (node) { return node !== headerNode && node !== blankNode && node !== countNode; });
                    if (animate && isAnimated()) {
                        rows.forEach(function (node, i) {
                            node.classList.add('term-fade');
                            node.style.opacity = '0';
                            void node.offsetHeight;
                            setTimeout(function () { node.style.opacity = '1'; keepInView(node); }, i * LINE_MS);
                        });
                    } else {
                        rows.forEach(function (node) { node.style.opacity = '1'; });
                    }
                    if (rows.length) keepInView(rows[rows.length - 1]);
                    if (view === 'tree' && !timeline && isAnimated()) {
                        ensureCursor();
                        cursorAtLineEnd(promptEnd);
                    }
                }
                // Opens every folder on the way to a route, so the route shows in the tree
                function expandPath(key) {
                    var acc = '';
                    (key ? key.split('/') : []).forEach(function (part) {
                        acc = acc ? acc + '/' + part : part;
                        if (isFolder(acc)) expanded[acc] = true;
                    });
                }

                // Where the terminal is: the folder of the path, and the file shown, if any. The title and the prompt show it
                var current = { folder: '', file: null };
                function setPath(folder, file) {
                    current = { folder: folder, file: file || null };
                    var path = file ? '/' + file : (folder ? '/' + folder : '/');
                    document.title = path + ' — Stavros Michailidis';
                    promptEnd.querySelector('.term-prompt').textContent = promptText(folder);
                }

                // The two views: the tree, or a file's subpage (or an error). The prompt that takes a typed command, and the place
                // where the new nodes go, belong to the view on screen
                var view = 'tree';
                var live = promptEnd;
                var sink = null;

                var content = {};   // a file's route -> { ok, text }, once it has loaded
                var loading = {};   // a file's route -> its load promise
                function loadFile(key) {
                    if (!loading[key]) {
                        loading[key] = fetch(new URL(key, document.baseURI))
                            .then(function (res) {
                                if (!res.ok) throw new Error('HTTP ' + res.status);
                                return res.text();
                            })
                            .then(function (text) { content[key] = { ok: true, text: text }; },
                                  function () { content[key] = { ok: false }; });
                    }
                    return loading[key];
                }

                // The markdown the files use: headings, paragraphs, lists and fenced code, and inside them links, bold and `code`
                function markdownBlocks(text) {
                    var lines = text.replace(/\r\n?/g, '\n').split('\n');
                    var blocks = [];
                    var i = 0;
                    while (i < lines.length) {
                        var line = lines[i];
                        if (/^\s*$/.test(line)) { i++; continue; }
                        if (/^```/.test(line)) {
                            var code = [];
                            i++;
                            while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
                            i++;
                            blocks.push({ type: 'code', text: code.join('\n') });
                            continue;
                        }
                        var heading = line.match(/^#{1,6}\s+(.*)$/);
                        if (heading) {
                            blocks.push({ type: 'heading', text: heading[1] });
                            i++;
                            continue;
                        }
                        if (/^\s*[-*]\s+/.test(line)) {
                            var items = [];
                            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
                                items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
                                i++;
                            }
                            blocks.push({ type: 'list', items: items });
                            continue;
                        }
                        var para = [];
                        while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|```|\s*[-*]\s+)/.test(lines[i])) {
                            para.push(lines[i].trim());
                            i++;
                        }
                        blocks.push({ type: 'para', text: para.join(' ') });
                    }
                    return blocks;
                }
                // A link's address, resolved from the file's place in the site. Only web and mail addresses are kept
                function linkTarget(href, key) {
                    try {
                        var url = new URL(href, new URL(key, document.baseURI));
                        if (url.protocol === 'http:' || url.protocol === 'https:' || url.protocol === 'mailto:') return url.href;
                    } catch (e) {}
                    return null;
                }
                function inlineInto(parent, text, key) {
                    var pattern = /\*\*([^*]+)\*\*|`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)/g;
                    var last = 0;
                    var m;
                    while ((m = pattern.exec(text)) !== null) {
                        if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
                        if (m[1] !== undefined) {
                            parent.appendChild(el('strong', null, m[1]));
                        } else if (m[2] !== undefined) {
                            parent.appendChild(el('code', null, m[2]));
                        } else {
                            var href = linkTarget(m[4], key);
                            if (href) {
                                var a = el('a', null, m[3]);
                                a.setAttribute('href', href);
                                if (/^https?:/.test(href)) {
                                    a.setAttribute('target', '_blank');
                                    a.setAttribute('rel', 'noopener');
                                }
                                parent.appendChild(a);
                            } else {
                                parent.appendChild(document.createTextNode(m[3]));
                            }
                        }
                        last = pattern.lastIndex;
                    }
                    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
                }
                function fileLines(key, text) {
                    return markdownBlocks(text).map(function (b) {
                        var node;
                        if (b.type === 'heading') {
                            node = el('h2', 'term-block term-heading');
                            inlineInto(node, b.text, key);
                        } else if (b.type === 'para') {
                            node = el('p', 'term-block');
                            inlineInto(node, b.text, key);
                        } else if (b.type === 'list') {
                            node = el('ul', 'term-block');
                            b.items.forEach(function (item) {
                                var li = el('li');
                                inlineInto(li, item, key);
                                node.appendChild(li);
                            });
                        } else {
                            node = el('pre', 'term-block term-code', b.text);
                        }
                        return node;
                    });
                }

                // The cursor: a block the height of the text, in the body text colour. The script moves it with transform
                var cursor = null;
                function ensureCursor() {
                    if (!cursor) {
                        cursor = el('span', 'term-cursor');
                        cursor.setAttribute('aria-hidden', 'true');
                    }
                    if (!cursor.parentNode) terminal.appendChild(cursor);
                }
                function removeCursor() {
                    if (cursor && cursor.parentNode) cursor.parentNode.removeChild(cursor);
                }
                function placeCursor(x, y, w, h) {
                    ensureCursor();
                    var box = terminal.getBoundingClientRect();
                    cursor.style.width = w + 'px';
                    cursor.style.height = h + 'px';
                    cursor.style.transform = 'translate(' + (x - box.left) + 'px, ' + (y - box.top) + 'px)';
                }
                // After a character: at its right edge
                function cursorAfterChar(span) {
                    var r = span.getBoundingClientRect();
                    placeCursor(r.right, r.top, r.width, r.height);
                }
                // At the end of a line: after its last text, or at the start of a blank line
                function cursorAtLineEnd(line) {
                    var size = parseFloat(getComputedStyle(line).fontSize);
                    var range = document.createRange();
                    range.selectNodeContents(line);
                    var rects = Array.prototype.filter.call(range.getClientRects(), function (r) { return r.width > 0; });
                    var last = rects[rects.length - 1];
                    if (last) {
                        placeCursor(last.right, last.top, size * 0.625, last.height);
                    } else {
                        var box = line.getBoundingClientRect();
                        placeCursor(box.left, box.top, size * 0.625, box.height);
                    }
                }

                function isAnimated() { return root.getAttribute('data-motion') === 'animated'; }
                function keepInView(node) { node.scrollIntoView({ block: 'nearest' }); }

                // A timeline runs each action at its time. When its last action has run, onDone is called, if there is one
                var timeline = null;
                function startTimeline(actions, onDone) {
                    var tl = { actions: actions, ran: [], count: 0, timers: [], onDone: onDone };
                    timeline = tl;
                    root.classList.add('term-live');
                    actions.forEach(function (a, i) {
                        tl.timers.push(setTimeout(function () { runOne(tl, i); }, a.at));
                    });
                }
                function runOne(tl, i) {
                    if (timeline !== tl || tl.ran[i]) return;
                    tl.ran[i] = true;
                    tl.count++;
                    tl.actions[i].fn(false);
                    if (tl.count === tl.actions.length) {
                        timeline = null;
                        if (tl.onDone) tl.onDone();
                    }
                }
                // A timeline that is running shows the rest at once, and its timers stop. onDone is not called
                function finishTimeline() {
                    var tl = timeline;
                    if (!tl) return;
                    timeline = null;
                    tl.timers.forEach(clearTimeout);
                    tl.actions.forEach(function (a, i) {
                        if (!tl.ran[i]) {
                            tl.ran[i] = true;
                            a.fn(true);
                        }
                    });
                }

                // Each action changes the page. In animated mode (instant false) it fades in, and the cursor follows it. In minimal
                // mode (instant true) it shows at once
                function typeChar(ch) {
                    return function (instant) {
                        var span = el('span', 'term-char', ch);
                        live.appendChild(span);
                        if (!instant) {
                            ensureCursor();
                            cursorAfterChar(span);
                        }
                        keepInView(live);
                    };
                }
                function showOutput(node) {
                    return function (instant) {
                        if (instant) {
                            node.style.opacity = '1';
                            sink.appendChild(node);
                        } else {
                            // Starts from opacity 0 and then goes to 1, so the fade runs
                            node.classList.add('term-fade');
                            node.style.opacity = '0';
                            sink.appendChild(node);
                            void node.offsetHeight;
                            node.style.opacity = '1';
                            ensureCursor();
                            cursorAtLineEnd(node);
                        }
                        keepInView(node);
                    };
                }
                function showPrompt(folder) {
                    return function (instant) {
                        var p = promptLine(folder);
                        sink.appendChild(p);
                        live = p;
                        if (!instant) {
                            ensureCursor();
                            cursorAtLineEnd(p);
                        }
                        keepInView(p);
                    };
                }
                // Turns the steps of a command into timed actions. A step types its command, waits, prints its output line by line,
                // and shows a new prompt
                function buildActions(steps) {
                    var actions = [];
                    var clock = 0;
                    steps.forEach(function (step) {
                        var t = clock;
                        Array.from(step.text).forEach(function (ch, i) {
                            if (i > 0) t += TYPE_MIN_MS + Math.random() * (TYPE_MAX_MS - TYPE_MIN_MS);
                            actions.push({ at: t, fn: typeChar(ch) });
                        });
                        var outStart = t + PAUSE_MS;
                        step.lines.forEach(function (node, i) {
                            actions.push({ at: outStart + i * LINE_MS, fn: showOutput(node) });
                        });
                        var promptAt = outStart + (step.lines.length - 1) * LINE_MS + LINE_FADE_MS;
                        actions.push({ at: promptAt, fn: showPrompt(step.promptFolder) });
                        clock = promptAt + PAUSE_MS;
                    });
                    return actions;
                }

                // The two views. The tree stays in the page while a file is shown, so going back shows it as it was
                function showTree() {
                    if (view === 'tree') return;
                    finishTimeline();
                    view = 'tree';
                    fileView.textContent = '';
                    fileView.hidden = true;
                    treeView.hidden = false;
                    live = promptEnd;
                    sink = null;
                    if (isAnimated()) {
                        ensureCursor();
                        cursorAtLineEnd(promptEnd);
                    }
                }
                function showFileView() {
                    finishTimeline();
                    view = 'file';
                    treeView.hidden = true;
                    fileView.hidden = false;
                }
                // Starts a subpage, or an error: its command types at a new prompt in the folder, then the output follows
                function startFileView(steps, folder) {
                    var prompt = promptLine(folder);
                    fileView.textContent = '';
                    fileView.appendChild(prompt);
                    sink = fileView;
                    live = prompt;
                    var actions = buildActions(steps);
                    if (isAnimated()) startTimeline(actions, null);
                    else actions.forEach(function (a) { a.fn(true); });
                }
                // A file's steps: `cat` and the file's content, then the cd .. line back to the tree
                function fileStep(key) {
                    var c = content[key];
                    var folder = folderOf(key);
                    var lines = c && c.ok ? fileLines(key, c.text) : [lineEl('cat: ' + nameOf(key) + ': No such file or directory')];
                    lines.push(upLine(folder));
                    return { text: 'cat ' + nameOf(key), lines: lines, promptFolder: folder };
                }
                function errorStep(raw, folder) {
                    return { text: 'cd ' + raw, lines: [lineEl('cd: no such file or directory'), upLine(folder)], promptFolder: folder };
                }

                // Shows a route: a file's subpage, or the tree with its folder open. The folders on the way open too
                function applyRoute(key, raw) {
                    if (key === null) {
                        setPath(current.folder);
                        showFileView();
                        startFileView([errorStep(raw, current.folder)], current.folder);
                        return;
                    }
                    if (isFile(key) && !content[key]) {
                        loadFile(key).then(function () { if (lastRoute === key) applyRoute(key, key); });
                        return;
                    }
                    expandPath(key);
                    if (isFile(key)) {
                        var folder = folderOf(key);
                        setPath(folder, key);
                        showFileView();
                        renderTree(false);
                        startFileView([fileStep(key)], folder);
                    } else {
                        showTree();
                        setPath(key);
                        renderTree(true);
                    }
                }

                // The last route asked for. A hash change to it is not run again, since a click has already run it
                var lastRoute = null;
                // The address the page opened on. It runs once the landing has played, unless the reader has already picked a route
                var initial = parseHash(location.hash);
                var pendingInitial = true;
                function settleInitial() {
                    if (!pendingInitial) return;
                    pendingInitial = false;
                    lastRoute = routeId(initial.key, initial.raw);
                    applyRoute(initial.key, initial.raw);
                }

                // A click or the navbar: sets the address to the route and shows it
                function navigate(key) {
                    pendingInitial = false;
                    lastRoute = key;
                    if (location.hash !== hashFor(key)) location.hash = hashFor(key);
                    applyRoute(key, key);
                }
                // A click on a folder opens it, or closes it if it is open. It becomes the current path either way
                function toggleDir(key, link) {
                    pendingInitial = false;
                    showTree();
                    var active = document.activeElement;
                    expanded[key] = !expanded[key];
                    setPath(key);
                    lastRoute = key;
                    if (location.hash !== hashFor(key)) location.hash = hashFor(key);
                    renderTree(!!expanded[key]);
                    if (active && !active.isConnected) link.focus({ preventScroll: true });
                }

                // The file loads and the tree are ready. Links that name a route get it as data, so a click can run it
                Array.prototype.forEach.call(document.querySelectorAll('a[href^="#/"]'), function (a) {
                    var p = parseHash(a.getAttribute('href'));
                    if (p.key !== null) a.setAttribute('data-route', p.key);
                });
                Object.keys(FILES).forEach(function (key) { loadFile(key); });

                // A click on a route runs it. The browser's own change of address is then not run again
                document.addEventListener('click', function (e) {
                    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
                    var link = e.target.closest ? e.target.closest('a[data-route]') : null;
                    if (!link) return;
                    e.preventDefault();
                    var key = link.getAttribute('data-route');
                    if (link.hasAttribute('data-toggle')) toggleDir(key, link);
                    else navigate(key);
                });
                // Back, forward and a typed address show their route
                window.addEventListener('hashchange', function () {
                    var p = parseHash(location.hash);
                    var id = routeId(p.key, p.raw);
                    if (id === lastRoute) return;
                    pendingInitial = false;
                    lastRoute = id;
                    applyRoute(p.key, p.raw);
                });
                // Leaving animated mode shows everything at once and stops the timeline. Switching back later does not replay the landing
                new MutationObserver(function () {
                    if (isAnimated()) return;
                    finishTimeline();
                    removeCursor();
                    root.classList.remove('term-live');
                    settleInitial();
                }).observe(root, { attributes: true, attributeFilter: ['data-motion'] });

                // The landing types whoami and tree. Its tree lines are the tree, so they show as the tree renders
                function splitChars(node, spans) {
                    Array.prototype.slice.call(node.childNodes).forEach(function (child) {
                        if (child.nodeType === 3) {
                            var fragment = document.createDocumentFragment();
                            Array.prototype.forEach.call(child.textContent, function (ch) {
                                var span = el('span', 'term-char', ch);
                                span.style.opacity = '0';
                                fragment.appendChild(span);
                                spans.push(span);
                            });
                            node.replaceChild(fragment, child);
                        } else if (child.nodeType === 1) {
                            splitChars(child, spans);
                        }
                    });
                    return spans;
                }
                // Schedules the typed characters of a command: the first at `start`, then each after a random interval
                function typeSpans(spans, start, actions) {
                    var at = start;
                    spans.forEach(function (span, i) {
                        if (i > 0) at += TYPE_MIN_MS + Math.random() * (TYPE_MAX_MS - TYPE_MIN_MS);
                        actions.push({ at: at, span: span, fn: showSpan(span) });
                    });
                    return at;
                }
                function showSpan(span) {
                    return function (instant) {
                        span.style.opacity = '1';
                        if (!instant) {
                            ensureCursor();
                            cursorAfterChar(span);
                        }
                    };
                }
                function showLandingLine(line, moveCursor) {
                    return function (instant) {
                        line.style.opacity = '1';
                        if (!instant && moveCursor) {
                            ensureCursor();
                            cursorAtLineEnd(line);
                        }
                    };
                }
                function moveCursorTo(line) {
                    return function (instant) {
                        if (!instant) {
                            ensureCursor();
                            cursorAtLineEnd(line);
                        }
                    };
                }
                function landingActions() {
                    var actions = [];
                    var cmd1 = document.getElementById('term-cmd-1');
                    var cmd2 = document.getElementById('term-cmd-2');
                    var printed = document.getElementById('term-print-1');
                    var outLines = Array.prototype.slice.call(output.querySelectorAll('.term-line'));

                    // The first prompt, `~$` and the space after it, shows from the start. Only `whoami` types, after the wait
                    var cmd1Spans = splitChars(cmd1, []);
                    var promptChars = cmd1.querySelector('.term-prompt').textContent.length + 1;
                    cmd1Spans.slice(0, promptChars).forEach(function (span) { span.style.opacity = '1'; });
                    var typed1End = typeSpans(cmd1Spans.slice(promptChars), FADE_MS + AFTER_FADE_MS, actions);
                    // The output of `whoami` appears at once, together with the second prompt
                    var outputAt = typed1End + PAUSE_MS;
                    actions.push({ at: outputAt, line: printed, fn: showLandingLine(printed, true) });
                    var cmd2Spans = splitChars(cmd2, []);
                    var promptChars2 = cmd2.querySelector('.term-prompt').textContent.length + 1;
                    cmd2Spans.slice(0, promptChars2).forEach(function (span) {
                        actions.push({ at: outputAt, span: span, fn: showSpan(span) });
                    });
                    // `tree` types after the second prompt, after a short pause
                    var typed2End = typeSpans(cmd2Spans.slice(promptChars2), outputAt + PROMPT_PAUSE_MS, actions);
                    // The tree fades in line by line. The final prompt fades in as the tree starts, and the cursor moves to it once the
                    // tree has faded in
                    var treeAt = typed2End + PAUSE_MS;
                    var treeIn = treeAt;
                    outLines.forEach(function (line, i) {
                        line.classList.add('term-fade');
                        actions.push({ at: treeAt + i * LINE_MS, line: line, fn: showLandingLine(line, true) });
                        treeIn = treeAt + i * LINE_MS + LINE_FADE_MS;
                    });
                    promptEnd.classList.add('term-fade');
                    actions.push({ at: treeAt, line: promptEnd, fn: showLandingLine(promptEnd, false) });
                    actions.push({ at: treeIn, fn: moveCursorTo(promptEnd) });
                    return { actions: actions, navStart: treeIn + NAV_GAP_MS };
                }

                // The tree as it starts: the root, with no folder open. Then the landing, or at once in minimal mode
                setPath('');
                renderTree(false);
                lastRoute = routeId(initial.key, initial.raw);
                if (isAnimated()) {
                    var landing = landingActions();
                    landing.actions.forEach(function (a) {
                        if (a.span) a.span.style.opacity = '0';
                        if (a.line) a.line.style.opacity = '0';
                    });
                    ensureCursor();
                    var first = landing.actions[0].span.getBoundingClientRect();
                    placeCursor(first.left, first.top, first.width, first.height);
                    navbar.style.setProperty('--drop-delay', landing.navStart + 'ms');
                    startTimeline(landing.actions, settleInitial);
                } else {
                    settleInitial();
                }
            }

            // If the terminal fails, the page shows everything: the hidden states apply only while term-failed is absent
            try {
                startTerminal();
            } catch (e) {
                document.querySelectorAll('#terminal .term-char, #terminal .term-line').forEach(function (el) { el.style.opacity = '1'; });
                document.documentElement.classList.add('term-failed');
            }
        </script>
    </body>
    </html>
