<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stavros-mhs, work in progress</title>
  <meta name="description" content="stavros-mhs.github.io is being rebuilt. Work in progress.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #f4ecdc;
      --surface: #e8dcc6;
      --text: #5a4c3c;
      --accent: #b5602e;
      --link: #805832;
      --link-hover: #8a3c12;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #2e2e2e;
        --surface: #4a4a4a;
        --text: #e0ddd8;
        --accent: #edab71;
        --link: #d8b78e;
        --link-hover: #f0cfa8;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      font-size: 1rem;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 560px;
    }
    h1 {
      display: table;
      margin: 0 0 1rem;
      padding: 0.1em 0.5em;
      background: var(--surface);
      color: var(--accent);
      border-radius: 6px;
      font-size: 2rem;
      font-weight: 500;
      line-height: 1.2;
    }
    p {
      margin: 0 0 1rem;
    }
    a {
      color: var(--link);
    }
    a:hover {
      color: var(--link-hover);
    }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>stavros-mhs</h1>
    <p>Work in progress. The site is being rebuilt, and it will be back soon.</p>
    <p>The code is on <a href="https://github.com/stavros-mhs">GitHub</a>.</p>
  </main>
</body>
</html>
